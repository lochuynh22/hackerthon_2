<body>
  <h2>Quản Lí Sinh Viên</h2>
  <!-- bootstrap -->
  <!-- form_add -->

  <div class="form_box">
    <div class="border_box">
      <form onsubmit="addStudent(event)" class="text_box">
        <div class="form-group">
          <label for="name" hidden></label>
          <input type="text" class="form-control" placeholder="Họ và Tên" name="name" required>
          <!-- <label for="name">họ và tên không được để trống</label> -->
        </div>
        <div class="form-group">
          <label for="idStudent" hidden></label>
          <input type="text" class="form-control" placeholder="Mã Số Sinh Viên" name="idStudent" required>
          <!-- <label for="idStudent">Mã số sinh viên không được để trống</label> -->
        </div>
        <div class="form-group">
          <label for="email" hidden></label>
          <input type="email" class="form-control" placeholder="Email" name="email" required>
          <!-- <label for="email">Email không hợp lệ</label> -->
        </div>
        <div class="form-group">
          <label for="class" hidden></label>
          <input type="text" class="form-control" placeholder="Lớp" name="class" required>
          <!-- <label for="class">Lớp không được để trống</label> -->
        </div>

        <button type="submit" class="btn btn-primary" id="btnbtnSave_edit">Thêm Sinh viên</button>
      </form>
    </div>
  </div>
  <!-- search -->
  <div class="contrainer_box">
    <div class="search_box">
    <input type="text" id="ip_search" placeholder="Tim kiem theo ten"> <button onclick="searchStudent()">search</button>
  </div>


  <!-- table_student -->
  <div class="table_data">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Họ và Tên</th>
          <th scope="col">MSSV</th>
          <th scope="col">Email</th>
          <th scope="col">Lớp</th>
          <th scope="col">Hành động</th>

        </tr>
      </thead>
      <tbody>
        <!-- <tr>
        <th scope="row">Trần Minh cường</th>

        </td>

      </tbody>
  </div>


  </table>
